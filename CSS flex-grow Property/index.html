<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Flex Grow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Thực hành CSS Flex Grow</h1>
        <p>Khám phá cách Flex Item mở rộng trong Flex Container</p>
    </header>

    <main class="content">
        <h2>Ví dụ: flex-grow với 5 Flex Item</h2>
        <p>
            Item 2 có flex-grow: 1 nên sẽ nhận phần không gian còn trống
            trong container.
        </p>

        <div class="container">
            <div class="item">Item 1</div>
            <div class="item item-grow">Item 2<br>flex-grow: 1</div>
            <div class="item">Item 3</div>
            <div class="item">Item 4</div>
            <div class="item">Item 5</div>
        </div>
    </main>

    <footer>
        <p>© 2026 - Bài thực hành CSS Flexbox</p>
    </footer>
</body>
</html>
